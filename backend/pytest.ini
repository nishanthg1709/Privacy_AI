[pytest]
markers =
    real_inference: marks tests that execute live neural model inference (select with '-m real_inference')
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    # PyTorch 2.14 JIT warning under Python 3.14 (torch.jit.script deprecated in 3.14+)
    ignore:.*torch.*:FutureWarning
